services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vedic_atlas}
      MYSQL_USER: ${MYSQL_USER:-vedic_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_database_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-vedic_app} -p${MYSQL_PASSWORD:-change_this_database_password} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    build:
      context: .
    command: ["sh", "-c", "pnpm exec drizzle-kit migrate"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-vedic_app}:${MYSQL_PASSWORD:-change_this_database_password}@db:3306/${MYSQL_DATABASE:-vedic_atlas}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-vedic_app}:${MYSQL_PASSWORD:-change_this_database_password}@db:3306/${MYSQL_DATABASE:-vedic_atlas}
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_secret}
      VITE_APP_ID: ${VITE_APP_ID:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mysql_data:
