name: Verify GHCR image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to pull and inspect
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  pull-and-inspect:
    name: Pull and inspect published image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull published image
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          docker pull "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Inspect image digest
        run: docker image inspect "$IMAGE" --format 'Pulled image digest: {{index .RepoDigests 0}}'
