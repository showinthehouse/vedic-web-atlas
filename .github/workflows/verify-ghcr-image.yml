name: Verify GHCR image v1.0.0

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  pull-and-inspect:
    name: Pull and inspect published image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull published image
        env:
          IMAGE_TAG: "1.0.0"
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          docker pull "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Inspect image digest
        run: docker image inspect "$IMAGE" --format 'Pulled image digest: {{index .RepoDigests 0}}'
